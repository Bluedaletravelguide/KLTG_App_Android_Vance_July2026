name: kltheguide
description: A new Flutter project.
publish_to: "none"

version: 1.6.0+72
environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_native_splash: ^2.4.6
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1
  http: ^1.4.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  intl: ^0.20.2
  html: ^0.15.6
  flutter_html: ^3.0.0-beta.2
  flutter_inappwebview: ^6.1.5
  shared_preferences: ^2.5.3
  flutter_pdfview: ^1.4.1+1
  flutter_cached_pdfview: ^0.4.3
  flutter_downloader: ^1.12.0
  path_provider: ^2.1.5
  google_mobile_ads: ^6.0.0
  url_launcher: ^6.3.1
  vibration: ^3.1.3
  font_awesome_flutter: ^10.8.0
  package_info_plus: ^8.3.0
  archive: ^4.0.7
  flutter_localizations:
    sdk: flutter
  in_app_update: ^4.2.3
  camera: ^0.11.0+2
  geolocator: ^10.1.0
  flutter_compass: ^0.8.0
  sensors_plus: ^6.0.1
  tflite_flutter: ^0.12.1
  image: ^4.5.4
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  onesignal_flutter: ^5.3.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  intl_utils: ^2.8.11
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/android-chrome-512x512.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/contentList/historicalPlaces/5.jpg
    - assets/models/landmarks_labels.txt
  fonts:
    - family: MyFlutterApp
      fonts:
        - asset: assets/fonts/MyFlutterApp.ttf
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway-Regular.ttf
        - asset: assets/fonts/Raleway-Bold.ttf
          weight: 700
        - asset: assets/fonts/Raleway-Black.ttf
          weight: 900
